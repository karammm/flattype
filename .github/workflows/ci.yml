name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    name: packages (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build typecheck test --filter="./packages/*"
      - run: pnpm check:dist
      - run: pnpm check:size

  hardening:
    name: deep fuzzing + linear-time checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter="./packages/*"
      # 50,000 random values per encode option, 200,000 random documents through the decoder.
      - run: pnpm --filter @flattype/core exec vitest run test/roundtrip.test.ts test/security.test.ts
        env:
          FUZZ_RUNS: "50000"
      # Timing tests run alone so nothing else competes for the CPU.
      - run: pnpm --filter @flattype/core --filter @flattype/models --filter @flattype/ai --workspace-concurrency=1 test:perf

  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The conformance cases come from the JavaScript packages; their own test fails if the files are stale.
      - run: uv run --python ${{ matrix.python }} pytest
      - if: matrix.python == '3.13'
        run: |
          uv run mypy
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pytest tests/perf_linear.py
          uv build
          uvx twine check --strict dist/*

  browsers:
    name: examples + real browsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # Angular CLI 22 (examples/angular-app) needs a current Node 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter="./packages/*"
      - run: pnpm --filter "./examples/*" --filter "./apps/*" typecheck
      - run: pnpm --filter @flattype/example-react-app exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter "./examples/*" --filter "./apps/*" --workspace-concurrency=1 e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: "**/test-results"

  supply-chain:
    name: known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No known high or critical vulnerabilities in what users install
        run: pnpm audit --prod --audit-level high
